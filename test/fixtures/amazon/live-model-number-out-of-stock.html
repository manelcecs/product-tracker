<!DOCTYPE html>
<html lang="es">
<head><title>Amazon.es</title></head>
<body>
<div id="titleSection" class="a-section a-spacing-none">
  <h1 id="title" class="a-size-large a-spacing-none">
    <span id="productTitle" class="a-size-large product-title-word-break">
      Nintendo Switch 2 - The Legend of Zelda Edition
    </span>
  </h1>
</div>

<div id="availability_feature_div" class="celwidget" data-csa-c-asin="B0F2TN43GH">
  <div id="availability" class="a-section a-spacing-none">
    <script type="text/javascript">
      P.when('A').execute(function (A) {
        A.trigger('availability:noise-only-should-be-stripped');
      });
    </script>
    <span class="a-declarative" data-action="show-all-offers-display" data-show-all-offers-display="{}">
      <span class="a-size-medium a-color-base primary-availability-message"> No disponible. </span>
    </span>
    <br/>
    <style>
      .availabilityMoreDetailsIcon {
        width: 12px;
        vertical-align: baseline;
        fill: #969696;
      }
    </style>
  </div>
</div>

<div id="apex_desktop" class="celwidget"></div>

<!-- Unrelated sponsored/carousel item price that must NOT be read as the product's own price. -->
<div id="sponsoredProductsCarousel">
  <span class="a-price" data-a-size="medium_plus" data-a-color="base">
    <span class="a-offscreen">59,90&nbsp;€</span>
  </span>
</div>

<div id="detailBullets_feature_div">
  <ul class="a-unordered-list a-nostyle a-vertical a-spacing-none detail-bullet-list">
    <li><span class="a-list-item"> <span class="a-text-bold">Fecha de lanzamiento &rlm; : &lrm; </span> <span>29 octubre 2026</span> </span></li>
    <li><span class="a-list-item"> <span class="a-text-bold">ASIN &rlm; : &lrm; </span> <span>B0F2TN43GH</span> </span></li>
    <li><span class="a-list-item"> <span class="a-text-bold">N&uacute;mero de modelo del producto &rlm; : &lrm; </span> <span>10019448</span> </span></li>
  </ul>
</div>
</body>
</html>
